<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B2545" />
  <meta name="description" content="المحاضرات — أكاديمية آل الزين للعلوم القانونية والعدلية" />
  <title>المحاضرات — أكاديمية آل الزين</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/alzain-academy/css/views/student-dashboard.css" />
  <link rel="stylesheet" href="/alzain-academy/css/views/student-lectures.css" />
  <link rel="stylesheet" href="/alzain-academy/css/portal-theme.css" />
  <script type="module" crossorigin src="/alzain-academy/assets/pages-student-lectures-D6cN69QR.js"></script>
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/base-CCmrW03f.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/auth-39CNNLuZ.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/portal-SoFHdmLY.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/api-BSXaKdAH.js">
</head>
<body class="portal">
  <div id="app">
    <main class="content" id="content">
      <div class="lcs-page">
        <section class="lcs-header">
          <h1>محاضراتي</h1>
          <p>صفِّ المحاضرات حسب المقرر أو النوع أو الحالة، وافتح التفاصيل لمعرفة موعدها ومادتها.</p>
        </section>

        <section class="lcs-stats" id="lcsStats" aria-label="إحصاءات المحاضرات" aria-live="polite">
          <div class="lcs-skeleton lcs-skeleton-stat"></div>
          <div class="lcs-skeleton lcs-skeleton-stat"></div>
          <div class="lcs-skeleton lcs-skeleton-stat"></div>
          <div class="lcs-skeleton lcs-skeleton-stat"></div>
        </section>

        <section class="lcs-filters" aria-label="تصفية المحاضرات">
          <div class="lcs-course-tabs" id="lcsCourseTabs" role="tablist" aria-label="تصفية حسب المقرر">
            <div class="lcs-skeleton lcs-skeleton-tab"></div>
            <div class="lcs-skeleton lcs-skeleton-tab"></div>
            <div class="lcs-skeleton lcs-skeleton-tab"></div>
          </div>
          <div class="lcs-controls">
            <div class="lcs-field">
              <label class="lcs-sr-only" for="lcsStatus">تصفية حسب الحالة</label>
              <select class="lcs-select" id="lcsStatus" disabled>
                <option value="all">كل الحالات</option>
                <option value="live">جارية الآن</option>
                <option value="attended">حضرتها</option>
                <option value="upcoming">قادمة</option>
                <option value="missed">فائتة</option>
              </select>
            </div>
            <div class="lcs-field">
              <label class="lcs-sr-only" for="lcsType">تصفية حسب نوع المحاضرة</label>
              <select class="lcs-select" id="lcsType" disabled>
                <option value="all">كل الأنواع</option>
                <option value="direct">مباشر</option>
                <option value="online">أونلاين</option>
                <option value="recorded">مسجل</option>
              </select>
            </div>
            <div class="lcs-field lcs-search">
              <label class="lcs-sr-only" for="lcsSearch">بحث في المحاضرات</label>
              <span class="lcs-search-icon" data-icon="search" aria-hidden="true"></span>
              <input class="lcs-input" id="lcsSearch" type="search" placeholder="ابحث عن محاضرة..." autocomplete="off" disabled />
            </div>
            <div class="lcs-view-toggle" role="group" aria-label="طريقة عرض المحاضرات">
              <button class="lcs-view-btn is-active" type="button" data-view="grid" aria-label="عرض شبكي" aria-pressed="true" disabled>
                <span data-icon="grid" aria-hidden="true"></span>
              </button>
              <button class="lcs-view-btn" type="button" data-view="list" aria-label="عرض قائمة" aria-pressed="false" disabled>
                <span data-icon="list" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </section>

        <section class="lcs-grid" id="lcsGrid" aria-live="polite" aria-label="قائمة المحاضرات">
          <div class="lcs-skeleton lcs-skeleton-card"></div>
          <div class="lcs-skeleton lcs-skeleton-card"></div>
        </section>
      </div>
    </main>
  </div>

</body>
</html>
