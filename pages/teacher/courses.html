<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="/alzain-academy/css/views/loading.css" />
  <link rel="stylesheet" href="/alzain-academy/css/portal-theme.css" />
  <script type="module" crossorigin src="/alzain-academy/assets/pages-teacher-courses-AdRSxCyK.js"></script>
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/base-CLcZMpw2.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/identity-rules-Cp64wFaG.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/first-visit-BDQ6DJqx.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/portal-xyj4PMfy.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/api-DQI-AaeE.js">

</head>
<body class="portal">
  <div id="app">
    <main class="content" id="content">
      <div class="tc-page">
        <section class="tc-header">
          <div>
            <h1>مقرراتي</h1>
            <p>متابعة مقرراتك وطلابك. تُدار المقررات من بوابة الإدارة.</p>
          </div>
        </section>

        <section class="tc-stats" id="tcStats" aria-live="polite" aria-label="إحصاءات المقررات"></section>

        <section class="tc-filters" aria-label="تصفية المقررات">
          <div class="tc-tabs" id="tcTabs" role="tablist" aria-label="حالة المقرر">
            <button class="tc-tab tc-active" type="button" data-filter="all" role="tab" aria-selected="true">الكل <span data-count="all">—</span></button>
            <button class="tc-tab" type="button" data-filter="active" role="tab" aria-selected="false">نشطة <span data-count="active">—</span></button>
            <button class="tc-tab" type="button" data-filter="archived" role="tab" aria-selected="false">مؤرشفة <span data-count="archived">—</span></button>
          </div>
          <div class="tc-controls">
            <label class="tc-sr-only" for="tcLevel">تصفية حسب المستوى</label>
            <select class="tc-input" id="tcLevel" disabled>
              <option value="all">كل المستويات</option>
              <option value="1">المستوى الأول</option>
              <option value="2">المستوى الثاني</option>
              <option value="3">المستوى الثالث</option>
              <option value="4">المستوى الرابع</option>
            </select>
            <label class="tc-sr-only" for="tcSort">ترتيب المقررات</label>
            <select class="tc-input" id="tcSort" disabled>
              <option value="code">حسب الرمز</option>
              <option value="students">حسب عدد الطلاب</option>
              <option value="recent">الأحدث</option>
            </select>
            <label class="tc-sr-only" for="tcSearch">بحث في المقررات</label>
            <div class="tc-search">
              <span class="tc-search-icon" aria-hidden="true"></span>
              <input class="tc-input" id="tcSearch" type="search" placeholder="ابحث عن مقرر..." autocomplete="off" disabled />
            </div>
          </div>
        </section>

        <section class="tc-grid" id="tcGrid" aria-live="polite" aria-label="قائمة المقررات"></section>
      </div>
    </main>
  </div>

</body>
</html>
