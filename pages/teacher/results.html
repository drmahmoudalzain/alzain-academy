<body class="portal">
  <div id="app">
    <main class="content" id="content">
      <div class="tr-page">
        <header class="tr-head">
          <div>
            <span class="tr-kicker">بوابة الأستاذ · نتائج المقررات</span>
            <h1 id="trTitle">توصيات نتائج مقرراتي</h1>
            <p id="trIntro">نتائج مقرراتك المسندة في العام المفتوح. تسجيل التوصية فقط، والقرار النهائي بيد المالك.</p>
          </div>
          <button class="tt-btn tt-btn-ghost" id="trRefreshBtn" type="button">تحديث</button>
        </header>

        <p class="tr-note">التوصية فقط: لا تُعدّل الدرجات أو النقاط أو حالة النتيجة من هنا. أقل من حد النجاح لا يُعدّ رسوباً تلقائياً، والمالك يتجاوز التوصية بقرار موثّق.</p>

        <div class="tr-filters">
          <label class="tr-label" for="trTerm">الفصل</label>
          <select class="tt-input" id="trTerm" aria-label="الفصل">
            <option value="">كل الفصول</option>
            <option value="1">الفصل الأول</option>
            <option value="2">الفصل الثاني</option>
          </select>
          <button class="tt-btn tt-btn-primary" id="trLoadBtn" type="button">عرض النتائج</button>
        </div>

        <p class="tr-summary" id="trSummary" role="status"></p>
        <p class="tr-msg" id="trMsg" role="status" hidden></p>
        <div id="trResults" aria-live="polite"></div>
      </div>
    </main>
  </div>
