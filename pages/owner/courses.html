<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B2545" />
  <meta name="description" content="المقررات — بوابة المالك، أكاديمية آل الزين" />
  <title>المقررات — أكاديمية آل الزين</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/alzain-academy/css/views/student-dashboard.css" />
  <link rel="stylesheet" href="/alzain-academy/css/views/owner-dashboard.css" />
  <link rel="stylesheet" href="/alzain-academy/css/portal-theme.css" />
  <script type="module" crossorigin src="/alzain-academy/assets/pages-owner-courses-DiciyWt-.js"></script>
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/base-CLcZMpw2.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/identity-rules-Cp64wFaG.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/first-visit-BDQ6DJqx.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/portal-75pk5vcp.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/api-DQI-AaeE.js">
</head>
<body class="portal">
  <div id="app">
    <main class="content" id="content">
      <div class="od-page">
        <section class="od-hero" aria-labelledby="ocTitle">
          <div class="od-hero-head">
            <div class="od-hero-body">
              <span class="od-tag">بوابة المالك · إدارة المقررات</span>
              <h1 id="ocTitle">المقررات</h1>
              <p id="ocIntro">إنشاء وتعديل المقررات وإسناد الأساتذة.</p>
            </div>
          </div>
        </section>

        <section class="od-panel" aria-labelledby="ocActionsTitle">
          <div class="od-panel-head">
            <h2 class="od-section-title" id="ocActionsTitle">إجراءات</h2>
            <div id="ocActions" class="od-actions"></div>
          </div>
        </section>

        <section class="od-panel" id="ocFormPanel" hidden aria-labelledby="ocFormTitle">
          <h2 class="od-section-title" id="ocFormTitle">إنشاء مقرر</h2>
          <form id="ocForm" class="od-form">
            <div class="od-field"><label for="ocMode">نوع الإنشاء</label><select class="od-select" id="ocMode" name="mode">
              <option value="new">مقرر جديد</option>
              <option value="branch">فرع لأصل موجود</option>
              <option value="family">أصل وفرعاه</option>
            </select></div>
            <div class="od-field" id="ocBranchFields" hidden><label for="ocParentInput">المقرر الأصل</label><select class="od-select" id="ocParentInput" name="parent_course_id"></select></div>
            <div class="od-field" id="ocGenderFields" hidden><label for="ocBranchTrackInput">الفرع</label><select class="od-select" id="ocBranchTrackInput" name="branch_track">
              <option value="bachelor_m">ذكور (-M)</option>
              <option value="bachelor_f">إناث (-F)</option>
            </select></div>
            <div class="od-field"><label for="ocTitleInput">العنوان</label><input class="od-input" id="ocTitleInput" name="title" required /></div>
            <div class="od-field"><label for="ocCodeInput">الرمز</label><input class="od-input" id="ocCodeInput" name="code" required readonly dir="ltr" /></div>
            <div class="od-field"><label for="ocDescriptionInput">الوصف</label><textarea class="od-textarea" id="ocDescriptionInput" name="description"></textarea></div>
            <div class="od-field"><label for="ocTrackInput">المسار</label><select class="od-select" id="ocTrackInput" name="track">
              <option value="bachelor_m">بكالوريوس (ذكور)</option>
              <option value="bachelor_f">بكالوريوس (إناث)</option>
              <option value="bachelor">بكالوريوس (مشترك)</option>
              <option value="equiv">معادلة</option>
              <option value="external">خارجي</option>
              <option value="grad">دراسات عليا</option>
            </select></div>
            <div class="od-field"><label for="ocLevelInput">المستوى</label><input class="od-input" id="ocLevelInput" name="level" type="number" min="1" max="4" /></div>
            <div class="od-field"><label for="ocColorInput">اللون</label><input class="od-input" id="ocColorInput" name="color" type="color" value="#123A63" /></div>
            <div class="od-field"><label for="ocTeacher">الأستاذ المسؤول</label><select class="od-select" name="teacher_id" id="ocTeacher"></select></div>
            <div class="od-field"><label for="ocAwInput">أوزان (حضور/اختبارات/واجبات)</label>
              <div style="display:flex;gap:6px;">
                <input class="od-input" id="ocAwInput" name="aw" type="number" min="0" max="100" value="10" />/
                <input class="od-input" name="ew" type="number" min="0" max="100" value="60" />/
                <input class="od-input" name="asw" type="number" min="0" max="100" value="30" />
              </div>
            </div>
            <div class="od-form-actions"><button type="submit" class="od-btn od-btn--primary" id="ocSubmitBtn"><span class="od-btn-spinner"></span> حفظ</button><button type="button" class="od-btn od-btn--ghost" id="ocCancel">إلغاء</button></div>
            <div id="ocMsg" class="od-inline-msg" aria-live="polite" hidden></div>
          </form>
        </section>

        <section class="od-panel" aria-labelledby="ocListTitle">
          <div class="od-panel-head">
            <h2 class="od-section-title" id="ocListTitle">القائمة</h2>
            <label class="od-check"><input type="checkbox" id="ocShowArchived" /> عرض المؤرشفة</label>
          </div>
          <div id="ocTable" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
