<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B2545" />
  <meta name="description" content="المحاضرات — بوابة المالك، أكاديمية آل الزين" />
  <title>المحاضرات — أكاديمية آل الزين</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/alzain-academy/css/views/owner-dashboard.css" />
  <link rel="stylesheet" href="/alzain-academy/css/portal-theme.css" />
  <script type="module" crossorigin src="/alzain-academy/assets/pages-owner-lectures-Cy377IuZ.js"></script>
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/base-CLcZMpw2.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/identity-rules-Cp64wFaG.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/first-visit-BDQ6DJqx.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/portal-CbIpfvfB.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/api--00KnVIC.js">
</head>
<body class="portal">
  <div id="app">
    <main class="content" id="content">
      <div class="od-page">
        <section class="od-hero" aria-labelledby="olTitle">
          <div class="od-hero-head">
            <div class="od-hero-body">
              <span class="od-tag">بوابة المالك · إدارة المحاضرات</span>
              <h1 id="olTitle">المحاضرات</h1>
              <p id="olIntro">عرض وإضافة محاضرات المقررات.</p>
            </div>
          </div>
        </section>
        <section class="od-panel" aria-labelledby="olFilterTitle">
          <h2 class="od-section-title" id="olFilterTitle">تصفية</h2>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <select class="od-select" id="olCourse"><option value="">كل المقررات</option></select>
            <select class="od-select" id="olType">
              <option value="all">كل الأنواع</option>
              <option value="direct">مباشر</option>
              <option value="online">أونلاين</option>
              <option value="recorded">مسجل</option>
            </select>
          </div>
        </section>
        <section class="od-panel" aria-labelledby="olListTitle">
          <div class="od-panel-head">
            <h2 class="od-section-title" id="olListTitle">القائمة</h2>
            <button class="od-btn od-btn--primary" id="olNewBtn"><span class="od-btn-spinner"></span> إضافة محاضرة</button>
          </div>
          <div id="olTable" aria-live="polite"></div>
        </section>
        <section class="od-panel" id="olFormPanel" hidden aria-labelledby="olFormTitle">
          <h2 class="od-section-title" id="olFormTitle">إضافة محاضرة</h2>
          <form id="olForm" class="od-form">
            <div class="od-field"><label>المقرر</label><select name="course_id" id="olFormCourse" required></select></div>
            <div class="od-field"><label>العنوان</label><input name="title" required /></div>
            <div class="od-field"><label>الوصف</label><textarea name="description"></textarea></div>
            <div class="od-field"><label>النوع</label><select name="lecture_type">
              <option value="direct">مباشر</option>
              <option value="online">أونلاين</option>
              <option value="recorded">مسجل</option>
            </select></div>
            <div class="od-field"><label>المدة (دقيقة)</label><input name="duration_min" type="number" value="120" /></div>
            <div class="od-field"><label>وضع البث</label><select name="broadcast_mode">
              <option value="">— افتراضي —</option>
              <option value="internal">على المنصة</option>
              <option value="youtube">YouTube</option>
              <option value="meet">Google Meet</option>
            </select></div>
            <div class="od-field"><label>وسائط البث</label><select name="broadcast_media">
              <option value="">—</option>
              <option value="audio">صوت</option>
              <option value="video">صوت وصورة</option>
              <option value="both">صوت وصورة (كامل)</option>
            </select></div>
            <div class="od-field"><label>رابط YouTube</label><input name="youtube_url" /></div>
            <div class="od-field"><label>رابط Live</label><input name="live_url" /></div>
            <div class="od-field"><label>موعد (ISO)</label><input name="scheduled_at" type="datetime-local" /></div>
            <div class="od-btn-row"><button type="submit" class="od-btn od-btn--primary" id="olSubmitBtn"><span class="od-btn-spinner"></span> حفظ</button><button type="button" class="od-btn od-btn--ghost" id="olCancel">إلغاء</button></div>
            <div id="olMsg" aria-live="polite"></div>
          </form>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
