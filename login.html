<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول — أكاديمية آل الزين</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/alzain-academy/css/login-extra.css" />
  <script type="module" crossorigin src="/alzain-academy/assets/login-BJPT-uni.js"></script>
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/base-CLcZMpw2.js">
  <link rel="modulepreload" crossorigin href="/alzain-academy/assets/identity-rules-DVz3p2Gs.js">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="loginTitle">
      <header class="login-brand">
        <div class="brand-emblem" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M32 6v46"/><path d="M20 52h24"/><circle cx="32" cy="10" r="3" fill="currentColor" stroke="none"/>
            <path d="M10 18h44"/><path d="M10 18L4 32h12L10 18z"/><path d="M54 18L48 32h12L54 18z"/>
            <path d="M4 32a6 6 0 0 0 12 0"/><path d="M48 32a6 6 0 0 0 12 0"/>
          </svg>
        </div>
        <h1 id="loginTitle">أكاديمية آل الزين</h1>
        <p>للعلوم القانونية والعدلية</p>
      </header>

      <form id="login-form" autocomplete="on" novalidate>
        <div class="form-field">
          <label for="identifier">الرمز الأكاديمي / الوظيفي</label>
          <input id="identifier" name="identifier" type="text" placeholder="مثال: BM0001 أو TE0002" autocomplete="username" inputmode="text" required />
        </div>

        <div class="form-field">
          <label for="password">كلمة المرور</label>
          <div class="password-field">
            <input id="password" name="password" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required />
            <button type="button" id="togglePassword" class="password-toggle" aria-label="إظهار كلمة المرور" aria-pressed="false" title="إظهار كلمة المرور">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.86 21.86 0 0 1 5.06-6.06"/><path d="M9.9 4.24A10.54 10.54 0 0 1 12 4c7 0 11 8 11 8a21.83 21.83 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 0 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
        </div>

        <button id="submit" class="primary-btn" type="submit">
          <span class="btn-label">تسجيل الدخول</span>
        </button>
        <p id="msg" class="form-msg" role="status" aria-live="polite"></p>
      </form>

      <section class="preview-logins" aria-labelledby="previewTitle">
        <div class="preview-divider"><span id="previewTitle">معاينة البوابات</span></div>
        <p class="preview-hint">استعرض واجهة كل بوابة دون تسجيل دخول — لن تظهر بيانات حقيقية.</p>
        <div class="preview-logins__grid">
          <button type="button" class="preview-login-btn" data-preview="owner">
            <span class="preview-icon" aria-hidden="true">👑</span>
            <span>دخول المدير</span>
          </button>
          <button type="button" class="preview-login-btn" data-preview="teacher">
            <span class="preview-icon" aria-hidden="true">🎓</span>
            <span>دخول الأستاذ</span>
          </button>
          <button type="button" class="preview-login-btn" data-preview="assistant">
            <span class="preview-icon" aria-hidden="true">🗂️</span>
            <span>دخول المساعد</span>
          </button>
          <button type="button" class="preview-login-btn" data-preview="student">
            <span class="preview-icon" aria-hidden="true">📚</span>
            <span>دخول الطلاب</span>
          </button>
        </div>
      </section>
    </section>
    <p class="login-footer">© أكاديمية آل الزين — جميع الحقوق محفوظة</p>
  </main>
</body>
</html>
