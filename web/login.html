<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول — آل الزين</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:40px;">
    <form id="login-form" style="width:100%;max-width:360px;display:grid;gap:12px;">
      <h2 style="font-family:Amiri,serif;color:#D4A017;text-align:center;">تسجيل الدخول</h2>
      <input id="email" type="email" placeholder="البريد (code@students.local)" required style="padding:10px;border-radius:8px;border:1px solid #ccc;" />
      <input id="password" type="password" placeholder="كلمة المرور" required style="padding:10px;border-radius:8px;border:1px solid #ccc;" />
      <button type="submit" style="padding:10px;border-radius:8px;background:#0B2545;color:#fff;border:none;cursor:pointer;">دخول</button>
      <p id="msg" style="text-align:center;color:#c00;min-height:1.2em;"></p>
    </form>
  </main>
  <script type="module" src="src/pages/login.js"></script>
</body>
</html>
